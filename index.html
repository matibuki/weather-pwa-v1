<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#e4dfd2" />
  <meta name="color-scheme" content="light" />
  <meta name="description" content="Panel pogody dla Lublina — konsensus wielu źródeł, tryb e-ink." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Pogoda Lublin" />
  <title>Pogoda Lublin</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Pogoda Lublin</h1>
        <div class="sub" id="status">Wczytywanie prognozy…</div>
      </div>
      <button type="button" id="refresh">Odśwież</button>
    </header>

    <nav class="tabs" id="tabs" aria-label="Zakładki"></nav>
    <div id="panels"></div>
  </div>

  <script src="js/app.js" defer></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch((err) => {
          console.warn("SW registration failed", err);
        });
      });
    }
  </script>
</body>
</html>
